<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>One Page E-commerce</title>
    <link rel="stylesheet" href="./styles/style.css" />
    <script src="./js/index.js"></script>
  </head>
  <body>
    <div class="packshot">
      <img
        src="./assets/images/image.jpg"
        alt="Product Image"
        onclick="getClickPosition(event)"
      />

      <div class="pastille-container" style="top: 279px; left: 299px">
        <div class="pastille">+</div>
        <div class="sub-pastilles">
          <div class="sub-pastille info">ⓘ</div>
          <div class="sub-pastille price">$599</div>
          <div class="sub-pastille cart">🛒</div>
        </div>
      </div>
    </div>
  </body>
</html>
