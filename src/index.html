<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>One Page E-commerce</title>
    <link rel="stylesheet" href="./styles/style.css" />
    <link rel="stylesheet" href="./styles/packshot.css" />
  </head>
  <body>
    <!-- Packshot template -->
    <template id="packshot-template">
      <div class="packshot">
        <img src="" alt="Product Image" onclick="getClickPosition(event)" />
        <div id="pastilles-container"></div>
      </div>
    </template>

    <!-- Pastille template -->
    <template id="pastille-template">
      <div class="pastille-container">
        <div class="pastille">+</div>
        <div class="sub-pastilles">
          <div class="sub-pastille info">ⓘ</div>
          <div class="sub-pastille price">$599</div>
          <div class="sub-pastille cart">🛒</div>
        </div>
      </div>
    </template>

    <div class="gallery">
      <div id="packshots-wrapper"></div>
    </div>
    <!-- Conteneur des packshots générés -->
  </body>
  <script src="./js/index.js"></script>
</html>
